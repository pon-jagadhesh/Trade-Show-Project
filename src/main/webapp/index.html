<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger Lite</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h2>Swagger Lite - API List</h2>
    <table>
        <thead>
            <tr>
                <th>API Name</th>
                <th>URL</th>
                <th>Methods</th>
                <th>Test</th>
            </tr>
        </thead>
        <tbody id="api-list"></tbody>
    </table>

    <h3>Select HTTP Method:</h3>
    <select id="method-selector">
        <option value="GET">GET</option>
        <option value="POST">POST</option>
    </select>

    <h3>Selected Method:</h3>
    <div id="selected-method" class="response-box">No request made yet.</div>

    <h3>Request Parameters:</h3>
    <input id="request-param" type="text" placeholder="Request Parameter(e.g-> key1=value1&key2=value2) ">
    <!-- <input id="request-param-value" type="text" placeholder="Parameter Value"> -->


    <h3>Request Headers:</h3>
    <input id="request-header-key" type="text" placeholder="Header Key">
    <input id="request-header-value" type="text" placeholder="Header Value">

    <h3>Request Body (For POST Requests):</h3>
    <textarea id="request-body" placeholder='{"key": "value"}'></textarea>

    <h3>Response:</h3>
    <div id="response" class="response-box">Click "Test" to see response</div>

    <script src="script.js"></script>
</body>
</html>
